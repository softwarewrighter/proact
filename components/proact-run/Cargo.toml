[workspace]
resolver = "2"
members = [
    "crates/run-files",
    "crates/run-learnings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright <mike@softwarewrighter.com>"]
repository = "https://github.com/softwarewrighter/proact"

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"

run-files = { path = "crates/run-files" }
run-learnings = { path = "crates/run-learnings" }
