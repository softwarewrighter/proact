[workspace]
resolver = "2"
members = [
    "crates/metadata-core",
    "crates/metadata-extract",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright <mike@softwarewrighter.com>"]
repository = "https://github.com/softwarewrighter/proact"

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"

metadata-core = { path = "crates/metadata-core" }
metadata-extract = { path = "crates/metadata-extract" }
